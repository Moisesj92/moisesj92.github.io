# Build del portafolio (Next.js export estático) y deploy a GitHub Pages.
# Requiere que Pages esté en modo "GitHub Actions" (Settings → Pages → Source).
name: pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "agent/**"
      - ".github/workflows/agent-*.yml"
  pull_request:
    paths-ignore:
      - "agent/**"
      - ".github/workflows/agent-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://moisesj92.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # Solo publica desde master; en PRs el job de build sirve como check.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
