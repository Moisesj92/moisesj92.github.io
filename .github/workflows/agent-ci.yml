# Checks del agente en cada PR: lint, tipos y build.
# Sin tests todavía: Vitest llega con el retriever (Fase 1) y las evals en Fase 3.
name: agent-ci

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"
  push:
    branches: [master]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/agent/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # El lockfile es único y vive en la raíz del workspace; pnpm solo lo
      # usa si el install corre desde ahí.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm test
      # build antes que tsc: next build genera next-env.d.ts (tipos de imágenes, rutas)
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
