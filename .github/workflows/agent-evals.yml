# Suite de evals del agente: ~76 casos contra la ruta de texto con Gemini
# como juez (~230 llamadas, ~10 minutos). Umbral: rechazos 100 %, resto ≥ 90 %.
#
# SOLO MANUAL mientras la key sea del free tier: cada corrida gasta casi la
# mitad de la cuota diaria de los modelos lite (500/día por modelo), que es
# la MISMA que usa la conversación por texto en producción. Para volver a
# correrla en cada PR sin afectar a producción, la key de CI debe ser de un
# proyecto de Google distinto (cuota propia) o de pago; entonces restaurar:
#
#   pull_request:
#     paths: ["agent/core/**", "agent/tenants/**", "agent/evals/**"]
#
# Mientras tanto: pnpm evals en local antes de mergear cambios de prompt,
# corpus o motor, y commitear evals/reports/latest.md.
name: agent-evals

on:
  workflow_dispatch:

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: agent/.nvmrc
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFAULT_TENANT: arsenio
        run: pnpm evals
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: |
            agent/evals/reports/latest.md
            agent/evals/reports/latest.json
          if-no-files-found: ignore
