# Suite de evals del agente: ~76 casos contra la ruta de texto con Gemini
# como juez (~230 llamadas, ~10 minutos). Umbral: rechazos 100 %, resto ≥ 90 %.
#
# Corre en cada PR que toque el motor, los tenants o los casos. Con la key
# de pago la cuota ya no es el límite (antes era manual: una corrida se
# comía media cuota diaria del free tier, la misma de producción).
# Además, en local: pnpm evals antes de mergear cambios de prompt o corpus,
# y commitear evals/reports/latest.md.
name: agent-evals

on:
  pull_request:
    paths:
      - "apps/agent/core/**"
      - "apps/agent/tenants/**"
      - "apps/agent/evals/**"
  workflow_dispatch:

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/agent/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # El lockfile es único y vive en la raíz del workspace; pnpm solo lo
      # usa si el install corre desde ahí.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFAULT_TENANT: arsenio
        run: pnpm evals
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: |
            agent/evals/reports/latest.md
            agent/evals/reports/latest.json
          if-no-files-found: ignore
