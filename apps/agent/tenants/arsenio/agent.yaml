id: arsenio
displayName: "Arsenio Jiménez"
languages: [es, en]

scope: "Arsenio Jiménez: su experiencia laboral, proyectos, decisiones técnicas, tecnologías y forma de trabajar"

persona: |
  Eres el asistente de voz del portafolio de Arsenio Jiménez, ingeniero de
  sistemas y desarrollador full stack con más de siete años de experiencia.
  Hablas con visitantes que suelen ser reclutadores o colegas técnicos.
  Tu tono es cercano, directo y profesional. Hablas de Arsenio en tercera
  persona.

  Arsenio siempre ha trabajado dentro de equipos de desarrollo. Cuando
  cuentes un logro, deja claro qué parte hizo él y que hubo compañeros que
  fueron parte del trabajo; nunca digas que construyó algo "solo" o "todo
  él" salvo que el documento lo diga explícitamente (sus proyectos
  independientes y las herramientas de la planta de residuos).

refusalPhrase: "Eso no lo tengo en mi información sobre Arsenio."

voice:
  provider: gemini-live
  model: gemini-3.8-live
  voiceName: Kore
  greeting: "Hola, soy el asistente de Arsenio. ¿Qué te gustaría saber sobre su experiencia?"

text:
  # Los lite responden igual de bien para este dominio y más rápido que
  # gemini-3.8-flash, que se midió y se descartó con la key de pago
  # (ADR-007, revisado en ADR-010).
  model: gemini-3.1-flash-lite
  fallbackModel: gemini-3.5-flash-lite

tools:
  - buscar_experiencia
  - mostrar_proyectos
  - descargar_cv
  - dejar_mensaje

ui:
  intro: "Pregúntale por su experiencia, sus proyectos o déjale un mensaje. Responde solo con información verificada y te dice de dónde la saca."
  cardsLabel: proyectos

limits:
  sessionSeconds: 300
  warningAtSeconds: 240
  messagesPerIpPerDay: 3
  # Por IP y día. Un token de voz precalentado sin usar también cuenta.
  voiceSessionsPerIpPerDay: 10
  textTurnsPerIpPerDay: 40
  # Presupuesto diario del tenant (ventana móvil de 24 h). Al llegar, el
  # canal se cierra solo y avisa por webhook al 50 % y al 100 %. Texto:
  # el límite ya no es la cuota sino el gasto: un turno son 1-2 llamadas.
  voiceSessionsPerDay: 60
  textTurnsPerDay: 250

links:
  cvPdf: https://moisesj92.github.io/cv/Arsenio_Jimenez_CV.pdf
  contactEmail: arsenio.jimenez92@outlook.com
  website: https://moisesj92.github.io

legal:
  responsible: "Arsenio Jiménez, persona natural, como responsable del tratamiento. Este asistente es un proyecto personal para que visitantes (normalmente reclutadores) conozcan su experiencia profesional."

brand:
  primaryColor: "#14b8a6"   # teal-500, el acento del template Spotlight
  avatar: avatar.jpg
